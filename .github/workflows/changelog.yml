name: Changelog Generator
on:
  pull_request:
    branches:
      - master
    types: [ opened, reopened, synchronize ]

jobs:
  changelog:
    name: Chanegelog Generator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: etcdigital/pull-request-changelog@master
        with:
          token: ${{ secrets.CHANGE_LOG }}
